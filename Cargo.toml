[package]
name = "Procedural_Generation"
version = "0.1.0"
edition = "2024"

[dependencies]
# Включаем dynamic_linking для быстрой сборки в дебаге
bevy = { version = "0.18.1", features = [
    "trace",
    "default",
    "ktx2",
    "dynamic_linking"
] }
rand = "0.9.4"
noise = "0.9.0"
voronoice = "0.2.0"
faster_poisson = "1.3.0"

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3