[package]
name = "Procedural_Generation"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", features = [
    "trace",
    "default",
    "ktx2",
    "dynamic_linking"
] }
noise = "0.9.0"
rayon = "1.12.0"

[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3